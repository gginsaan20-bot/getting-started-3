<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Commute Tracker</title><link rel="stylesheet" href="style.css"></head><body><aside><div class="logo">↗ <b>Commute</b></div><nav><button class="active" data-page="home">▦ Overview</button><button data-page="trips">↔ Trips</button><button data-page="cars">🚘 Vehicles</button><button data-page="reports">▤ Reports</button></nav><small>PERSONAL TRACKER<br>Private to this browser</small></aside><main><header><div><small>PERSONAL FINANCE / COMMUTE</small><h1 id="heading">Overview</h1></div><div><button id="export">↓ Backup</button> <button class="primary" id="addTrip">＋ Add trip</button></div></header><section id="view"></section><footer>Commute Tracker · Your data stays in this browser</footer></main>
<dialog id="carModal"><form id="carForm"><h2>Add vehicle</h2><label>Vehicle / driver name<input id="carName" required maxlength="50" placeholder="e.g. Blue Swift"></label><label>One-way fare (₹)<input id="one" type="number" min="0" step=".01" required></label><label>Round-trip fare (₹)<input id="round" type="number" min="0" step=".01" required></label><p class="muted">Going and return fares are calculated using the one-way fare twice.</p><menu><button type="button" data-close="carModal">Cancel</button><button class="primary">Save vehicle</button></menu></form></dialog>
<dialog id="tripModal"><form id="tripForm"><h2>Record commute</h2><label>Date<input id="date" type="date" required></label><label>Vehicle<select id="vehicle" required></select></label><div class="checks"><label><input id="go" type="checkbox" checked> Going</label><label><input id="back" type="checkbox" checked> Return</label></div><label>Extra charge (₹)<input id="extra" type="number" min="0" step=".01" value="0"></label><label>Note (optional)<input id="note" maxlength="140"></label><p class="preview" id="preview">Estimated fare: ₹0.00</p><menu><button type="button" data-close="tripModal">Cancel</button><button class="primary">Save trip</button></menu></form></dialog><script src="app.js"></script></body></html>
